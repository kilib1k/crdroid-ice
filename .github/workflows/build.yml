# Полная сборка crDroid для ice на бесплатных GitHub Actions.
# Сборка разбита на последовательные этапы (каждый <= ~5 ч компиляции). Если прошивка
# собралась раньше, оставшиеся этапы автоматически пропускаются.
name: Build crDroid (ice)

on:
  workflow_dispatch:
    inputs:
      crdroid_branch:
        description: "Ветка crDroid (15.0 = Android 15 / crDroid 11 — рекомендуется; 14.0 = Android 14 / crDroid 10 — экспериментально)"
        type: choice
        options: ["15.0", "14.0"]
        default: "15.0"
      variant:
        description: "Вариант сборки"
        type: choice
        options: ["userdebug", "user", "eng"]
        default: "userdebug"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage1:
    uses: ./.github/workflows/stage.yml
    with:
      stage: 1
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 2
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 3
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 4
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 5
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage6:
    needs: stage5
    if: needs.stage5.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 6
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage7:
    needs: stage6
    if: needs.stage6.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 7
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

  stage8:
    needs: stage7
    if: needs.stage7.outputs.done != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 8
      crdroid_branch: ${{ inputs.crdroid_branch }}
      variant: ${{ inputs.variant }}
    secrets: inherit

