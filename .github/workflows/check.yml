# Быстрая проверка (~1 ч): sync + lunch + `m nothing` (полный разбор Android.bp/Makefile
# без компиляции). Запускайте после правок манифестов/патчей, прежде чем гонять полную сборку.
name: Check config (ice)

on:
  workflow_dispatch:
    inputs:
      crdroid_branch:
        description: "Ветка crDroid"
        type: choice
        options: ["15.0", "14.0", "both"]
        default: "both"
  push:
    paths: ["manifests/**", "patches/**", "overrides/**", "scripts/**"]

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.b.outputs.branches }}
    steps:
      - id: b
        run: |
          B="${{ inputs.crdroid_branch || 'both' }}"
          if [[ "$B" == both ]]; then echo 'branches=["15.0","14.0"]' >> "$GITHUB_OUTPUT"
          else echo "branches=[\"$B\"]" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    name: check ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ROM_ROOT: /home/runner/rom
      CRDROID_BRANCH: ${{ matrix.branch }}
      VARIANT: userdebug
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with: { path: crdroid-ice }
      - run: crdroid-ice/scripts/free-space.sh
      - name: Диск (btrfs+zstd) и swap
        run: crdroid-ice/scripts/disk-setup.sh /home/runner/rom 24
      - run: |
          crdroid-ice/scripts/setup-runner.sh
          echo "REPO_DIR=$GITHUB_WORKSPACE/crdroid-ice" >> "$GITHUB_ENV"
      - run: crdroid-ice/scripts/sync.sh
      - run: crdroid-ice/scripts/apply-patches.sh
      - run: crdroid-ice/scripts/prune.sh
      - name: m nothing
        run: |
          crdroid-ice/scripts/build-stage.sh $(( $(date +%s) + 150*60 )) 0 nothing
          S=$(cat "$ROM_ROOT/status"); echo "### check ${CRDROID_BRANCH}: $S" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$S" != done ]]; then tail -n 150 "$ROM_ROOT/src/out/error.log" 2>/dev/null; exit 1; fi
      - name: Диск после sync
        if: always()
        run: df -h /home/runner/rom; sudo btrfs filesystem usage -T /home/runner/rom || true; sudo compsize -x /home/runner/rom 2>/dev/null | head || true; du -sh --apparent-size /home/runner/rom/src 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-error-${{ matrix.branch }}
          path: |
            /home/runner/rom/src/out/error.log
            /home/runner/rom/src/out/soong.log
          if-no-files-found: ignore
