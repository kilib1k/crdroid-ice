# Один этап сборки (вызывается из build.yml). Каждый этап — отдельный runner (лимит 6 ч на job),
# поэтому out/ передаётся между этапами через artifacts, а исходники синхронизируются заново
# по зафиксированному (pinned) манифесту.
name: stage

on:
  workflow_call:
    inputs:
      stage:          { type: number, required: true }
      crdroid_branch: { type: string, required: true }
      variant:        { type: string, required: true }
      build_minutes:  { type: number, default: 300 }   # сколько минут от старта job можно собирать
    outputs:
      done:
        description: "true, если прошивка полностью собрана"
        value: ${{ jobs.build.outputs.done }}

jobs:
  build:
    name: stage ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      done: ${{ steps.result.outputs.done }}
    env:
      ROM_ROOT: /home/runner/rom
      CRDROID_BRANCH: ${{ inputs.crdroid_branch }}
      VARIANT: ${{ inputs.variant }}
      STAGE: ${{ inputs.stage }}
    steps:
      - name: Время старта
        id: meta
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "prev=$(( ${{ inputs.stage }} - 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with: { path: crdroid-ice }

      - name: Освобождение диска
        run: crdroid-ice/scripts/free-space.sh

      - name: Диск (btrfs+zstd) и swap
        run: crdroid-ice/scripts/disk-setup.sh /home/runner/rom 24

      - name: Зависимости
        run: |
          crdroid-ice/scripts/setup-runner.sh
          echo "REPO_DIR=$GITHUB_WORKSPACE/crdroid-ice" >> "$GITHUB_ENV"

      - name: Загрузка out/ с прошлого этапа
        if: inputs.stage > 1
        uses: actions/download-artifact@v8
        with:
          name: out-stage-${{ steps.meta.outputs.prev }}
          path: /home/runner/rom/parts

      - name: Pinned manifest
        if: inputs.stage > 1
        uses: actions/download-artifact@v8
        with:
          name: pinned-manifest
          path: /home/runner/rom/manifest

      - name: Распаковка out/
        if: inputs.stage > 1
        run: crdroid-ice/scripts/unpack-out.sh

      - name: repo sync
        run: |
          if [[ "$STAGE" -gt 1 ]]; then
            crdroid-ice/scripts/sync.sh "$ROM_ROOT/manifest/pinned.xml"
          else
            crdroid-ice/scripts/sync.sh
          fi

      - name: Сохранить pinned manifest
        if: inputs.stage == 1
        uses: actions/upload-artifact@v7
        with:
          name: pinned-manifest
          path: /home/runner/rom/pinned.xml
          retention-days: 7

      - name: Патчи
        run: crdroid-ice/scripts/apply-patches.sh

      - name: Очистка исходников (git-объекты, лишние clang)
        run: crdroid-ice/scripts/prune.sh

      - name: Сборка (с ограничением по времени)
        run: |
          DEADLINE=$(( JOB_START + ${{ inputs.build_minutes }} * 60 ))
          RESUMED=0; [[ "$STAGE" -gt 1 ]] && RESUMED=1
          crdroid-ice/scripts/build-stage.sh "$DEADLINE" "$RESUMED" bacon

      - name: Результат
        id: result
        run: |
          S=$(cat "$ROM_ROOT/status" 2>/dev/null || echo failed)
          echo "status=$S" >> "$GITHUB_OUTPUT"
          [[ "$S" == done ]] && echo "done=true" >> "$GITHUB_OUTPUT" || echo "done=false" >> "$GITHUB_OUTPUT"
          echo "### Этап $STAGE: $S" >> "$GITHUB_STEP_SUMMARY"

      - name: Логи ошибок
        if: steps.result.outputs.status == 'failed' || failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-log-stage-${{ inputs.stage }}
          path: |
            /home/runner/rom/src/out/error.log
            /home/runner/rom/src/out/soong.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Ошибка сборки
        if: steps.result.outputs.status == 'failed'
        run: |
          tail -n 200 "$ROM_ROOT/src/out/error.log" 2>/dev/null || true
          echo "::error::Сборка упала с ошибкой (не по таймауту). См. artifact error-log-stage-$STAGE"
          exit 1

      # ---------- Не успели: упаковываем out/ для следующего этапа ----------
      - name: Упаковка out/
        if: steps.result.outputs.status == 'timeout'
        run: crdroid-ice/scripts/pack-out.sh

      - name: Выгрузка out/
        if: steps.result.outputs.status == 'timeout'
        uses: actions/upload-artifact@v7
        with:
          name: out-stage-${{ inputs.stage }}
          path: /home/runner/rom/parts
          compression-level: 0
          retention-days: 2

      # ---------- Готово: публикуем прошивку ----------
      - name: Сбор файлов прошивки
        if: steps.result.outputs.status == 'done'
        run: crdroid-ice/scripts/collect.sh

      - name: Artifact с прошивкой
        if: steps.result.outputs.status == 'done'
        uses: actions/upload-artifact@v7
        with:
          name: crdroid-ice-${{ inputs.crdroid_branch }}
          path: /home/runner/rom/release
          compression-level: 0
          retention-days: 30

      - name: GitHub Release
        if: steps.result.outputs.status == 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="crdroid-${CRDROID_BRANCH}-ice-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$ROM_ROOT"/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "crDroid ${CRDROID_BRANCH} для Redmi A1/A1+ / POCO C50 (ice) — $(date -u +%Y-%m-%d)" \
            --notes "Автосборка GitHub Actions, run ${GITHUB_RUN_ID}, вариант ${VARIANT}, этапов: ${STAGE}. Неофициальная тестовая сборка — сначала сделайте бэкап nvram/nvdata/persist."
