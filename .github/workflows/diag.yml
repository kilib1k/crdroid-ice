# Диагностика: сколько места занимают исходники и что самое тяжёлое.
name: Diag disk usage
on:
  workflow_dispatch:
    inputs:
      crdroid_branch: { type: choice, options: ["14.0", "15.0"], default: "14.0" }
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ROM_ROOT: /home/runner/rom
      CRDROID_BRANCH: ${{ inputs.crdroid_branch }}
    steps:
      - uses: actions/checkout@v7
        with: { path: crdroid-ice }
      - run: crdroid-ice/scripts/free-space.sh
      - name: Диск (btrfs+zstd) и swap
        run: crdroid-ice/scripts/disk-setup.sh /home/runner/rom 24
      - run: |
          crdroid-ice/scripts/setup-runner.sh
          echo "REPO_DIR=$GITHUB_WORKSPACE/crdroid-ice" >> "$GITHUB_ENV"
      - run: crdroid-ice/scripts/sync.sh || true
      - run: crdroid-ice/scripts/prune.sh || true
      - if: always()
        run: |
          cd /home/runner/rom/src
          df -h .
          echo "== .repo"; du -sh .repo; du -sh .repo/* 2>/dev/null
          echo "== top objects"; du -s .repo/project-objects/* .repo/project-objects/*/* 2>/dev/null | sort -rn | head -40
          echo "== top checkout"; for d in prebuilts prebuilts/* prebuilts/*/* prebuilts/clang/host/linux-x86/* external/* kernel/* device/*/* cts packages/*; do [ -d "$d" ] && du -s --apparent-size --exclude=.git "$d"; done 2>/dev/null | sort -rn | head -80
